name: CI-CD Mini CTF

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Evita ejecuciones simultaneas
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: mini-ctf
  PYTHON_VERSION: "3.12"   # misma version que el Dockerfile

jobs:

  # Pruebas sobre un ubuntu 26.04

  test:
    name: Pruebas unitarias
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Instalar dependencias (runtime + test)
        run: pip install -r requirements-dev.txt

      - name: pytest cobertura
        run: pytest --cov=app --cov-report=xml --cov-fail-under=70

      - name: subir Artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml

  build:
    name: Build imagen Docker
    runs-on: ubuntu-latest
    needs: test #Requerimiento de test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Construir imagen (tag por SHA + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  security:
    name: Analisis de seguridad
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Snyk - analisis de dependencias
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --file=requirements.txt --severity-threshold=high

  deploy:
    name: Deploy 
    runs-on: ubuntu-latest
    needs: [ test, build, security ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout del codigo
        uses: actions/checkout@v4

      - name: Levantar el servicio con Docker Compose
        run: docker compose up -d --build

      - name: Verificacion post-deploy (/health)
        run: | # Toma 10 intentos para probar el servicio, marcando como error si no responde
          for i in $(seq 1 10); do
            if curl --fail --silent http://localhost:8080/health; then
              echo "Servicio saludable"; exit 0
            fi
            echo "Esperando al servicio... ($i)"; sleep 3
          done
          echo "El servicio no respondio a tiempo"; exit 1

      - name: Registrar version desplegada (trazabilidad)
        run: echo "Desplegada imagen ${{ env.IMAGE_NAME }} con SHA ${{ github.sha }}"

      - name: Apagar el entorno
        if: always()
        run: docker compose down
